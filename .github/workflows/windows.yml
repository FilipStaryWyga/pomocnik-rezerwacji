name: Wersja na Windows

# Buduje PomocnikRezerwacji.exe i testuje go na Windowsie.
# Po wypchnięciu tagu (np. v4.0) publikuje wydanie z plikiem do pobrania:
#   https://github.com/<konto>/<repozytorium>/releases/latest/download/PomocnikRezerwacji.exe
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'   # polskie znaki w konsoli testów
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testy programu na Windowsie
        run: python test_windows.py

      - name: Ikona
        run: python ikona.py

      - name: Budowanie pliku .exe
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --onefile --noconsole --name PomocnikRezerwacji --icon ikona.ico --add-data "pomocnik.user.js;." pomocnik.py

      - name: Test gotowego .exe (instalacja, autostart, skróty, serwer, aktualizacja)
        shell: pwsh
        run: |
          Start-Process -FilePath dist\PomocnikRezerwacji.exe -ArgumentList '--w-tle'
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:47631/api/stan; $ok = $true; break } catch {}
          }
          if (-not $ok) { Write-Error 'Program nie odpowiada'; exit 1 }
          Write-Host "Wersja: $($r.wersja), autostart: $($r.autostart)"
          $exe = "$env:LOCALAPPDATA\Programs\PomocnikRezerwacji\PomocnikRezerwacji.exe"
          if (-not (Test-Path $exe)) { Write-Error 'Brak zainstalowanego pliku'; exit 1 }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PomocnikRezerwacji -ErrorAction SilentlyContinue
          if (-not $run) { Write-Error 'Brak autostartu'; exit 1 }
          Write-Host "Autostart: $($run.PomocnikRezerwacji)"
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Pomocnik rezerwacji.lnk'
          if (-not (Test-Path $lnk)) { Write-Error 'Brak skrótu w menu Start'; exit 1 }

          # Ręczna aktualizacja: użytkownik pobiera nową wersję (np. do Pobranych) i uruchamia ją,
          # gdy stara jeszcze działa. Pobrany plik ma zamknąć starą, podmienić plik i uruchomić się na jej miejscu.
          $stary = (Get-NetTCPConnection -LocalPort 47631 -State Listen | Select-Object -First 1).OwningProcess
          $pobrane = Join-Path $env:TEMP 'Pobrane'
          New-Item -ItemType Directory -Force $pobrane | Out-Null
          Copy-Item dist\PomocnikRezerwacji.exe (Join-Path $pobrane 'PomocnikRezerwacji.exe')
          Start-Process -FilePath (Join-Path $pobrane 'PomocnikRezerwacji.exe') -ArgumentList '--w-tle'
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            $nowy = (Get-NetTCPConnection -LocalPort 47631 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1).OwningProcess
            if ($nowy -and $nowy -ne $stary) {
              try { $r = Invoke-RestMethod http://127.0.0.1:47631/api/stan; $ok = $true; break } catch {}
            }
          }
          if (-not $ok) { Write-Error 'Pobrana wersja nie zastąpiła działającego programu'; exit 1 }
          $sciezka = (Get-Process -Id $nowy).Path
          if ($sciezka -ne $exe) { Write-Error "Po aktualizacji działa zła kopia: $sciezka"; exit 1 }
          Write-Host "Aktualizacja działa: proces $stary zastąpiony przez $nowy ($sciezka)"
          if (-not $r.nowa_wersja.mozliwe) { Write-Error 'Brak sprawdzania nowych wersji'; exit 1 }

          Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{}' http://127.0.0.1:47631/api/zakoncz | Out-Null
          Write-Host 'Instalacja i uruchomienie działają.'

      - uses: actions/upload-artifact@v4
        with:
          name: PomocnikRezerwacji-Windows
          path: dist/PomocnikRezerwacji.exe

      - name: Publikacja wydania
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PomocnikRezerwacji.exe
          body: |
            Pobierz **PomocnikRezerwacji.exe** i uruchom. Program sam się zainstaluje i otworzy stronę ustawień.
            Aktualizacja: pobierz nowy plik tak samo i uruchom go – ustawienia zostaną zachowane.
            Program (od wersji 4.1) sam powiadamia na telefonie i komputerze, gdy pojawi się nowa wersja.
            Jeśli Windows pokaże „System Windows ochronił ten komputer”, kliknij „Więcej informacji”, a potem „Uruchom mimo to”.
